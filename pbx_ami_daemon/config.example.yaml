# pbx_ami_daemon configuration
# Secrets should be provided via environment variables: ${ENV_VAR}

asterisk:
  host: localhost
  port: 5038
  user: pbx_admin
  secret: ${ASTERISK_AMI_SECRET}

messaging:
  type: rabbitmq          # rabbitmq or nats
  host: localhost
  port: 5672
  user: pbx
  secret: ${MQ_SECRET}
  vhost: pbx

webhook:
  url: https://odoo.example.com/pbx/webhook   # Odoo /pbx/webhook endpoint
  token: ${PBX_WEBHOOK_TOKEN}                  # default Bearer token
  tokens: {}                                   # per-tenant overrides: {vertel.se: token}

tenants:
  config_path: /etc/asterisk/tenants/
  manager_path: /etc/asterisk/manager.d   # AMI-permissions per instans (include: manager.d/*.conf)
  ari_path: /etc/asterisk/ari.d           # ARI-users per instans (include: ari.d/*.conf)

daemon:
  pid_file: /var/run/pbx-ami-daemon.pid
  log_level: INFO
  reconnect_interval: 5   # seconds between AMI reconnect attempts
  health_port: 8080       # health check HTTP endpoint

# ── ARI (nivå 2 — smart receptionist, pbx-ai-call-assistant) ──
ari:
  enabled: false           # sätt true för att aktivera ARI/Stasis
  base_url: http://localhost:8088   # ARI REST
  ws_url: ws://localhost:8089       # ARI WebSocket
  app: receptionist                 # Stasis-app-namn (måste matcha dialplan)
  api_key: ${ASTERISK_ARI_USER}:${ASTERISK_ARI_SECRET}
  coworker_id: 0                    # Odoo ai.coworker "PBX Receptionist"
  odoo_url: ${ODOO_URL}             # Odoo-base för webhook/TTS-URL
  webhook_token: ${PBX_WEBHOOK_TOKEN}
